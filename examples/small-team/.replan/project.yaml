project:
  id: project.replan-mvp
  name: RePlan MVP example
  format_version: 1
  timezone: Asia/Novosibirsk
  default_status_date: "2026-07-06"
  source_profiles:
    - id: openproject.demo
      source: openproject
      base_url: https://pm.example.test
      project_id: demo
      token_env: OPENPROJECT_TOKEN
      default_query:
        include_closed: "false"
    - id: github.demo
      source: github
      repository: example-org/planning-demo
      status_map:
        open: not_started
        "open:label:in progress": in_progress
        "closed:completed": accepted
        "closed:not_planned": cancelled
        "closed:duplicate": cancelled
      start_field: Start
      finish_field: Finish
      estimate_field: Estimate
  policy_ref:
    kind: policy
    id: policy.local-trusted
