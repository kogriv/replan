    summary: "The Python helpers and replan import openproject send the perimeter key from the settings file in X-Perimeter-Key, or a named header, beside the client's own token, and never print it. Two Go tests; check-agent-kit.sh, now 15 checks, runs both against a stand-in that records what it is sent, fails when the helpers omit the key, searches the binary for private details and requires the terms of use, which the archive now carries with its purpose named at build time. With the operator's go two keys were added to the live proxy's key file, with a backup, a configuration test and a reload. From outside over HTTPS the unpacked kit read the RePlan project with the key, 103 work packages, assignees, an aligned drift check and unchanged links, and was refused without it and with a wrong one. Booked amounts are agent estimates."
