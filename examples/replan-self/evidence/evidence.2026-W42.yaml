    summary: "The session that runs the second project used the agent kit as an outside user and got HTTP 401 from the reverse proxy, not from OpenProject. Reading the proxy configuration confirmed it: a shared password guards every path, and an API client passes only with a perimeter key in a request header, which the helpers cannot send. The agent's statement of 2026-10-12 that the API answers from outside had read the proxy's 401 as OpenProject's; the same finding was already recorded on 2026-09-25 and was not consulted."
