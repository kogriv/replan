  - id: evidence.self.retry-only-idempotent-openproject-requests
    type: command_result
    source: local
    actor_ref:
      kind: actor
      id: actor.ai.agent.executor
    observed_at: "2026-10-25T18:51:00+07:00"
    confidence: observed
    summary: "openproject_request_json retries GET, HEAD, PATCH with a lockVersion and calls marked idempotent (the three OpenProject form calls) only; POST, PUT, DELETE and PATCH without a lockVersion are sent once. Any request other than GET, HEAD or an idempotent call that ends in a timeout, a network error, a 408 or a 5xx reports outcome_unknown with retried and, when the policy refused a retry, retry_skipped; a 409 on a retried PATCH after such a failure adds earlier_attempt_may_have_applied. The fields reach the helper envelope, and the creating and updating helpers say to check OpenProject before running again. All six PATCH calls in the helpers already carry a lockVersion. Docs that recommend two retries say what is retried. Written by the Codex CLI agent (gpt-5.6-sol, medium) in three rounds of about 6, 3 and 3 minutes: the second covered a retried PATCH that meets 409 after its first attempt applied, the third the default of zero retries, where a timed out PATCH was still a plain failure. A connection refused also counts as outcome_unknown, which is cautious. On this project 13 helpers give the same output; the local gate and the throwaway runtime pass. Measured: Codex 0.19 h, the executor agent 0.38 h (18:28 to 18:51)."
    targets:
      - kind: task
        id: task.self.retry-only-idempotent-openproject-requests
