      description: 'Found on 2026-10-29 while recording the actual windows of the accepted tasks: eight of 165 self-dogfood work packages were automatically scheduled in OpenProject (scheduleManually false), the seven created on 2026-10-28 and one older accepted task. OpenProject moved them when their predecessors'' dates changed: the six open roadmap tasks to the day after their predecessors (two to eleven working days earlier than RePlan''s dates) when accept-task pushed the designs'' actual windows, and the accepted task one day earlier when the backfill moved its predecessor to a Sunday. The date helpers already set scheduleManually true; the likely cause is that creating a follows relation with apply-openproject-relations.sh switches the successor to automatic scheduling, and nothing switches it back. The dates were restored with push-openproject-date-drift.sh and work-package update-dates. Wanted: confirm the cause on the throwaway runtime; keep or restore manual scheduling of a bound successor when a relation is created, without changing its dates, through the reviewed relation helper with its dry run and apply gate; report a bound work package that is automatically scheduled as a drift warning code in check-openproject-drift.sh, and give date drift a warning code too so a soft date drift is not only a count; tests and the helper docs.'
