    - id: task.self.require-human-approvers
      title: Require a human actor to approve changes
      description: 'Found on 2026-10-30 while documenting the local trust boundary: only estimate calibrate refuses an approver that is not a human actor; proposal accept and reject, scenario apply, baseline create and import accept take any existing actor, an AI agent''s included, and trust_level and the proposal_only policy are recorded but not enforced. Require a human actor for the commands that approve or apply a change (approver_not_human, exit 3, as calibration does), enforce the policy''s proposal_only for AI agent actors on canonical writes or document precisely which writes an agent may make, and test both. This does not authenticate the caller; it stops an agent''s own actor from approving its own work.'
