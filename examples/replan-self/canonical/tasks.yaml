    - id: task.self.honest-weekly-workload-for-multi-week-and-concurrent-demands
      title: Make weekly workload honest for multi-week and concurrent demands
      description: Found while planning the plugin backlog. workload counts a demand in full in every week its window touches, so the 8-hour release story over two weeks shows 8 hours and an overload in each week, and it sums concurrent_slots demands over a week, so two tasks that use the single development slot one after the other in the same week look like a conflict. Spread a period demand over the working days of its window and count only the days inside the week; check concurrent capacity by overlapping days, not by weekly sums. Keep the all-weeks view, the dashboard Gantt load and the overlay consistent with the same rule, cover both cases with tests, update the spec, and record the gap.
